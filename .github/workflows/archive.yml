name: Archive source

on: push

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v7

      - name: Set up packaging Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Package committed source
        id: package
        shell: bash
        run: |
          archive="$(python scripts/package_source.py)"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Keep a downloadable package for this push
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Attach package to the version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$ARCHIVE")"; then
              echo "Package already attached to $tag"
            else
              gh release upload "$tag" "$ARCHIVE"
            fi
          else
            gh release create "$tag" "$ARCHIVE" --verify-tag --generate-notes --title "$tag"
          fi
